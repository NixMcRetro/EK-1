name: EK-1 MP3 encoder dependency
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/mp3-dependency.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Retrieve pinned encoder and complete upstream source
        run: |
          mkdir -p encoder
          npm pack lamejs@1.2.1 --pack-destination encoder
          tar -xzf encoder/lamejs-1.2.1.tgz -C encoder
          test -s encoder/package/lame.min.js
          test -s encoder/package/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: ek1-lamejs-1.2.1
          path: encoder/
          retention-days: 30
