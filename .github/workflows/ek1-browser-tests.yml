name: EK-1 offline release verification
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ek1-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify distributed files and licensing
        run: |
          node .github/tests/ek1-integrity.mjs
          for f in *.js; do node --check "$f"; done
          node .github/tests/ek1-midi-codec.mjs
          node .github/tests/ek1-musical-arrangement.mjs
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Appearance and remembered layout
        run: node .github/tests/ek1-preferences.mjs
      - name: Direct-file keyboard regression
        run: node .github/tests/ek1-browser-smoke.mjs
      - name: FM rendering
        run: node .github/tests/ek1-fm-audio.mjs
      - name: Direct-file SoundFont regression
        run: node .github/tests/ek1-soundfont-browser.mjs
      - name: Output ceiling and level regression
        run: node .github/tests/ek1-output-levels.mjs
      - name: Accompaniment and backing balance
        run: node .github/tests/ek1-accompaniment.mjs
      - name: Demonstration looping
        run: node .github/tests/ek1-demo-loop.mjs
      - name: Pause and demo voice regression
        run: node .github/tests/ek1-pause-browser.mjs
      - name: MIDI voice override and utility layout
        run: node .github/tests/ek1-midi-override.mjs
      - name: MIDI looping and keyboard navigation
        run: node .github/tests/ek1-midi-loop.mjs
      - name: Composition, project and audio export
        run: node .github/tests/ek1-composition-browser.mjs
      - name: Package exactly the tested source
        run: git archive --format=zip --prefix=EK-1-v1.0.1/ --output=EK-1-v1.0.1-offline.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: EK-1-v1.0.1-offline
          path: EK-1-v1.0.1-offline.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EK-1-browser-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7

  # Publish only the explicitly authorised first stable release, from a
  # successful main-branch run. No publish permissions on PR test jobs.
  release-v1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'EK-1 v1.0.1')
    needs: offline
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: EK-1-v1.0.1-offline
      - name: Publish exact tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.1"
          test -f EK-1-v1.0.1-offline.zip
          sha256sum EK-1-v1.0.1-offline.zip > EK-1-v1.0.1-offline.zip.sha256
          gh release create v1.0.1 EK-1-v1.0.1-offline.zip EK-1-v1.0.1-offline.zip.sha256 --target "$GITHUB_SHA" --title "EK-1 v1.0.1" --notes-file RELEASE-NOTES.md
