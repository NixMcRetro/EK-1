name: EK-1 Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run EK-1 keyboard regression
        run: node .github/tests/ek1-browser-smoke.mjs
